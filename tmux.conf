# agmux integration for tmux.
#
# Prefix binding:
#   Ctrl-b, then Ctrl-s: searchable agent/session picker in a popup.
# Prefix-less bindings (work while attached):
#   Alt-s: detach this client and run the agmux picker in the same terminal.
#   Alt-x: end the current session after a y/n confirmation.
#
# The popup passes its originating client explicitly because popups can lose
# the TMUX variable. Set AGMUX_BIN if agmux is not on the tmux server's PATH.
bind-key C-s run-shell -b 'tmux display-popup -c "#{client_tty}" -E -w 90% -h 85% "${AGMUX_BIN:-agmux} pick --client #{client_tty}"'
bind-key -n M-s detach-client -E 'unset TMUX TMUX_PANE; export AGMUX_TMUX_SOCKET="#{socket_path}"; exec "${AGMUX_BIN:-agmux}" pick'

# This kills the live tmux session and every program in it (detaching all
# clients). The prompt is deliberate; use the picker's Ctrl-D delete flow if
# you want agmux's typed-name confirmation and revalidation instead.
bind-key -n M-x confirm-before -p "Kill session #S and all its programs? (y/n)" kill-session
