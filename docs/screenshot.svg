<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="588" viewBox="0 0 1280 588" role="img" aria-label="agmux picker with per-session CPU and memory">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
      .bg { fill: #181825; }
      .chrome { fill: #11111b; }
      .title { fill: #a6adc8; }
      .default { fill: #cdd6f4; }
      .head { fill: #89dceb; }
      .agent { fill: #cba6f7; }
      .oc { fill: #89b4fa; }
      .run { fill: #a6e3a1; }
      .blocked { fill: #f38ba8; }
      .done { fill: #f9e2af; }
      .muted { fill: #7f849c; }
      .res { fill: #89b4fa; }
      .peach { fill: #fab387; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="520" rx="12" fill="#181825" filter="url(#shadow)"/>
  <path d="M20 32 a12 12 0 0 1 12 -12 h1216 a12 12 0 0 1 12 12 v26 h-1240 z" class="chrome"/>
  <circle cx="46" cy="39" r="7" fill="#f38ba8"/>
  <circle cx="70" cy="39" r="7" fill="#f9e2af"/>
  <circle cx="94" cy="39" r="7" fill="#a6e3a1"/>
  <text x="640" y="44" text-anchor="middle" class="mono title" opacity="0.75">agmux — ~/source/repos/agmux</text>

  <!-- header -->
  <text x="36" y="86" class="mono head" font-weight="bold">agmux 0.6.0</text>
  <text x="1244" y="86" text-anchor="end" class="mono muted">5 sessions · 2 running · 1 need input · 1 done</text>

  <!-- usage line (rate limits / token cost — not machine resources) -->
  <text x="36" y="110" class="mono muted">Codex · 5h 12% · 7d 34%</text>
  <text x="340" y="110" class="mono default">OpenCode 392K tok · $0.27</text>
  <text x="1244" y="110" text-anchor="end" class="mono muted">Ctrl-G details</text>

  <text x="36" y="134" class="mono head">Search: op</text>

  <!-- selection highlight -->
  <rect x="28" y="146" width="1224" height="24" rx="4" fill="#313244"/>

  <!-- row 1: blocked (selected) -->
  <text x="36" y="164" class="mono blocked" font-weight="bold">!</text>
  <text x="56" y="164" class="mono head" font-weight="bold">ty-review</text>
  <text x="210" y="164" class="mono agent">Codex</text>
  <text x="316" y="164" class="mono muted">2w</text>
  <text x="366" y="164" class="mono blocked">needs input</text>
  <text x="500" y="164" class="mono res">cpu 12% · mem 486M</text>
  <text x="700" y="164" class="mono default">codex</text>
  <text x="810" y="164" class="mono muted">~/source/repos/ty</text>
  <text x="1130" y="164" class="mono muted">2m</text>

  <!-- row 2: running attached -->
  <text x="36" y="188" class="mono run" font-weight="bold">▶</text>
  <text x="56" y="188" class="mono head" font-weight="bold">upgrades-4</text>
  <text x="210" y="188" class="mono agent">Codex</text>
  <text x="316" y="188" class="mono muted">2w</text>
  <text x="366" y="188" class="mono run">attached</text>
  <text x="500" y="188" class="mono res">cpu 37% · mem 611M</text>
  <text x="700" y="188" class="mono default">codex</text>
  <text x="810" y="188" class="mono muted">~/source/repos/ty</text>
  <text x="1130" y="188" class="mono muted">4m</text>

  <!-- row 3: running -->
  <text x="36" y="212" class="mono run" font-weight="bold">▶</text>
  <text x="56" y="212" class="mono head" font-weight="bold">opencode-ty</text>
  <text x="210" y="212" class="mono oc">OpenCode</text>
  <text x="316" y="212" class="mono muted">1w</text>
  <text x="500" y="212" class="mono res">cpu 4% · mem 228M</text>
  <text x="700" y="212" class="mono default">bun</text>
  <text x="810" y="212" class="mono muted">~/source/repos/ty</text>
  <text x="1130" y="212" class="mono muted">4s</text>

  <!-- row 4: finished -->
  <text x="36" y="236" class="mono done" font-weight="bold">✓</text>
  <text x="56" y="236" class="mono head" font-weight="bold">agmux</text>
  <text x="210" y="236" class="mono oc">OpenCode</text>
  <text x="316" y="236" class="mono muted">1w</text>
  <text x="500" y="236" class="mono res">cpu 1% · mem 233M</text>
  <text x="700" y="236" class="mono default">bun</text>
  <text x="810" y="236" class="mono muted">~/source/repos/agmux</text>
  <text x="1130" y="236" class="mono muted">12m</text>
  <text x="1194" y="236" class="mono done">✓</text>

  <!-- row 5: shell -->
  <text x="36" y="260" class="mono muted">·</text>
  <text x="56" y="260" class="mono head">scratch</text>
  <text x="210" y="260" class="mono muted">Shell</text>
  <text x="316" y="260" class="mono muted">1w</text>
  <text x="500" y="260" class="mono res">cpu 0% · mem 12M</text>
  <text x="700" y="260" class="mono default">vim</text>
  <text x="810" y="260" class="mono muted">~/notes</text>
  <text x="1130" y="260" class="mono muted">1h</text>

  <line x1="36" y1="284" x2="1244" y2="284" stroke="#313244" stroke-width="1"/>

  <!-- preview -->
  <text x="36" y="306" class="mono muted">codex  |  ~/source/repos/ty</text>
  <text x="36" y="330" class="mono blocked">! needs input: Allow command?  1. Yes  2. Yes, and don't ask again  3. No</text>
  <text x="36" y="358" class="mono default">  Reviewed 3 files and updated the parser cache.</text>
  <text x="36" y="382" class="mono default">  Running the test suite…</text>
  <text x="36" y="406" class="mono run">  ✔ 214 passed, 0 failed in 8.4s</text>
  <text x="36" y="430" class="mono default">  Next: git push origin main</text>

  <!-- footer -->
  <text x="36" y="512" class="mono muted">2 of 5 sessions   Enter attach · Ctrl-N new · Ctrl-R rename · Ctrl-D delete · F1 help</text>

  <text x="640" y="572" text-anchor="middle" class="mono muted" font-size="13">Simulated agmux screen — “cpu” / “mem” are the machine's CPU and RAM used by each session's processes.</text>
</svg>
